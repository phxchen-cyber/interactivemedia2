<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories Past</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="layout">
        <header class="hero">
            <h1> Memories Past</h1>
            <p>What memories do these pictures hold?

                <br> (Interact wih the page to find out)

            </p>
        </header>

        <div class="camera-main">
            <img class="camera" src="images/camera.png" alt="camera" id="camera">
        </div>

        <div id="end-overlay" class="end-overlay">
            <p class="end-title">Reached the end...?</p>
            <p class="end-reflection">That was a nice trip down memory lane, but what's next? Let's get out there and
                experience more.</p>
            <button id="reset-btn">Shut Down</button>
        </div>

    </main>

</body>

</html>
